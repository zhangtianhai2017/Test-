[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bikini-generator"
version = "0.1.0"
description = "Procedural 3D bikini swimwear generator with GPU cloth physics"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "taichi>=1.7",
    "Pillow>=10.0",
    "opensimplex>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ai = ["openai>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
bikini-generate = "scripts.generate_one:main"
bikini-web = "web.app:main"
