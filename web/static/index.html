<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Bikini Generator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <h1>3D Bikini Generator</h1>
            <p class="subtitle">Procedural Swimwear with GPU Physics</p>
        </header>

        <!-- Controls Panel -->
        <aside id="controls">
            <div class="control-group">
                <h3>Generate</h3>
                <button id="btn-generate" onclick="generateBikini()">
                    Generate Random
                </button>
                <button id="btn-generate-ai" onclick="generateBikini(true)">
                    AI Creative
                </button>
            </div>

            <div class="control-group">
                <h3>Options</h3>
                <label>
                    <input type="checkbox" id="chk-physics" checked>
                    Physics Validation
                </label>
                <label>
                    <input type="checkbox" id="chk-body" checked>
                    Show Body
                </label>
                <label>
                    <input type="checkbox" id="chk-wireframe">
                    Wireframe
                </label>
                <div class="input-row">
                    <label for="inp-seed">Seed:</label>
                    <input type="number" id="inp-seed" placeholder="Random">
                </div>
                <div class="input-row">
                    <label for="inp-texres">Tex Size:</label>
                    <select id="inp-texres">
                        <option value="256">256</option>
                        <option value="512" selected>512</option>
                        <option value="1024">1024</option>
                    </select>
                </div>
            </div>

            <!-- Design Info -->
            <div class="control-group" id="design-info" style="display:none">
                <h3>Design</h3>
                <div id="design-description"></div>
                <div id="design-stats"></div>
            </div>

            <!-- Status -->
            <div class="control-group">
                <h3>Status</h3>
                <div id="status">Ready</div>
            </div>
        </aside>

        <!-- 3D Viewport -->
        <main id="viewport">
            <canvas id="canvas3d"></canvas>
            <div id="loading" style="display:none">
                <div class="spinner"></div>
                <span>Generating...</span>
            </div>
        </main>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://unpkg.com/three@0.162.0/build/three.module.js" type="module"></script>
    <script src="/static/js/viewer.js" type="module"></script>
    <script src="/static/js/main.js" type="module"></script>
</body>
</html>
