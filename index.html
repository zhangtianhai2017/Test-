<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>拼图游戏 Jigsaw Puzzle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='54' font-size='60'%3E🧩%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">🧩 Jigsaw</div>

    <div class="controls">
      <label class="control">
        <span>难度</span>
        <select id="difficulty">
          <option value="3x4">简单 (3×4)</option>
          <option value="5x6" selected>普通 (5×6)</option>
          <option value="8x10">困难 (8×10)</option>
        </select>
      </label>

      <label class="control">
        <span>图片</span>
        <select id="presetImage">
          <option value="landscape">风景</option>
          <option value="geometric">几何</option>
          <option value="gradient">渐变</option>
        </select>
      </label>

      <label class="control file-control">
        <span>上传</span>
        <input type="file" id="uploadImage" accept="image/*" />
      </label>

      <button id="newGame" class="primary">开始新局</button>
      <button id="toggleRef">参考图 👁</button>
    </div>

    <div class="stats">
      <span>用时 <b id="timer">00:00</b></span>
      <span>步数 <b id="moves">0</b></span>
      <span>进度 <b id="progress">0 / 0</b></span>
    </div>
  </header>

  <main class="stage">
    <canvas id="board"></canvas>
    <img id="referenceImage" class="reference hidden" alt="reference" />
  </main>

  <div id="winModal" class="modal hidden">
    <div class="modal-card">
      <h2>🎉 拼图完成！</h2>
      <p>用时 <b id="winTime">00:00</b></p>
      <p>步数 <b id="winMoves">0</b></p>
      <button id="playAgain" class="primary">再来一局</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
