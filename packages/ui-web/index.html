<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blackjack — 2D</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Startup dialog — language + dealer persona pick, one-time per session. -->
    <div id="startupModal" class="modal-overlay">
      <div class="modal">
        <h2>Welcome · 欢迎</h2>
        <div class="modal-row">
          <label>Language · 语言</label>
          <div class="seg" id="langSeg">
            <button data-val="zh" class="on">中文</button>
            <button data-val="en">English</button>
          </div>
        </div>
        <div class="modal-row">
          <label>Dealer · 荷官</label>
          <div class="seg" id="personaSeg">
            <button data-val="veteran" class="on">老江湖</button>
            <button data-val="hostess">热情阿姨</button>
            <button data-val="mystic">神秘赌神</button>
          </div>
        </div>
        <div class="modal-row" id="serverStatusRow">
          <label>AI Service</label>
          <div id="serverStatus">checking...</div>
        </div>
        <button id="startBtn" class="start-btn">开始 · Start</button>
      </div>
    </div>

    <!-- Dealer speech bubble — appears on game events. -->
    <div id="dealerBubble" class="dealer-bubble">
      <div class="dealer-name" id="dealerName">庄家</div>
      <div class="dealer-text" id="dealerText"></div>
      <div class="dealer-src" id="dealerSrc"></div>
    </div>

    <div id="app">
      <header>
        <h1>Blackjack</h1>
        <div class="meta">
          <label>Rules
            <select id="ruleSet">
              <option value="VEGAS">Classic Vegas</option>
              <option value="SPANISH21">Spanish 21</option>
              <option value="PONTOON">Pontoon</option>
              <option value="SUPER_FUN_21">Super Fun 21</option>
            </select>
          </label>
          <span id="bankroll">筹码: 1000</span>
          <span id="phase">阶段: 下注</span>
        </div>
      </header>
      <div id="resultBanner" class="banner"></div>
      <main>
        <section id="dealer" class="zone">
          <h2>庄家</h2>
          <div id="dealerCards" class="cards"></div>
          <div id="dealerTotal" class="total"></div>
        </section>
        <section id="player" class="zone">
          <h2>玩家</h2>
          <div id="playerHands"></div>
        </section>
        <section id="controls">
          <div id="betControls" class="betControls">
            <label>主注 <input id="betAmount" type="number" value="25" min="5" /></label>
            <label>Perfect Pairs <input id="sbPP" type="number" value="0" min="0" /></label>
            <label>21+3 <input id="sb213" type="number" value="0" min="0" /></label>
            <label>Lucky Ladies <input id="sbLL" type="number" value="0" min="0" /></label>
            <button id="deal">发牌</button>
          </div>
          <div id="actions" class="actions">
            <button data-action="HIT">要牌</button>
            <button data-action="STAND">停牌</button>
            <button data-action="DOUBLE">加倍</button>
            <button data-action="SPLIT">分牌</button>
            <button data-action="SURRENDER">投降</button>
            <button data-action="INSURE">保险</button>
            <button data-action="DECLINE_INSURANCE">不保险</button>
            <button data-action="NEW_ROUND">下一局</button>
          </div>
        </section>
        <section id="log" aria-live="polite"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
