<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blackjack — 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #060; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; color: #eee; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; right: 12px;
        display: flex; justify-content: space-between; align-items: center;
        pointer-events: none;
      }
      #hud > * { pointer-events: auto; }
      #hud .grp { background: rgba(0,0,0,0.45); padding: 10px 14px; border-radius: 10px; backdrop-filter: blur(4px); font-size: 13px; }
      button { background: #c99b3a; color: #111; border: 0; border-radius: 6px; padding: 6px 10px; margin-right: 6px; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.3; }
      select, input { background: #111; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 4px 6px; }
      #bottom { position: fixed; bottom: 12px; left: 12px; right: 12px; display: flex; justify-content: center; gap: 8px; }
      #bottom .grp { background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 10px; }
      #log { position: fixed; right: 12px; bottom: 80px; width: 300px; max-height: 180px; overflow: auto; background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 11px; }
      .banner {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        padding: 28px 56px; border-radius: 16px;
        opacity: 0; pointer-events: none;
        transition: opacity 240ms, transform 240ms;
        box-shadow: 0 12px 48px rgba(0,0,0,0.6);
        z-index: 50; text-align: center;
        max-width: 92vw;
      }
      .banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      .banner-title {
        font-size: 46px; font-weight: 900; letter-spacing: 1.5px;
        line-height: 1.1; font-family: Georgia, "Playfair Display", ui-serif, serif;
      }
      .banner-sub {
        margin-top: 10px; font-size: 16px; font-weight: 500;
        opacity: 0.88; font-style: italic;
      }
      .banner-win  { background: linear-gradient(90deg, #0a6 0%, #6cff9a 100%); color: #003; }
      .banner-loss { background: linear-gradient(90deg, #800 0%, #ff5555 100%); color: #fff; }
      .banner-push { background: #333; color: #eee; }

      .banner-blackjack {
        background: linear-gradient(135deg, #2a1a0f 0%, #c99b3a 50%, #f6d870 75%, #c99b3a 100%);
        color: #2a1a0f;
        animation: bj-pulse 900ms ease-in-out infinite alternate;
      }
      .banner-blackjack .banner-title { font-size: 58px; text-shadow: 0 2px 0 rgba(255,255,255,0.45); }
      .banner-blackjack .banner-bj { display: inline-block; letter-spacing: 14px; font-size: 28px; font-weight: 900; }
      @keyframes bj-pulse {
        from { box-shadow: 0 0 30px #f6d870, 0 0 80px #c99b3a; }
        to   { box-shadow: 0 0 60px #f6d870, 0 0 140px #f6d870; }
      }

      .banner-bigwin {
        background: linear-gradient(90deg, #7a0b0b 0%, #ffb347 50%, #ffcc33 100%);
        color: #2a0000;
        animation: big-shake 520ms cubic-bezier(.36,.07,.19,.97) both;
      }
      .banner-bigwin .banner-title { font-size: 64px; text-shadow: 0 2px 0 rgba(255,255,255,0.4); }
      @keyframes big-shake {
        0%, 100% { transform: translate(-50%, -50%) rotate(0); }
        20% { transform: translate(calc(-50% - 6px), -50%) rotate(-1.2deg); }
        40% { transform: translate(calc(-50% + 6px), calc(-50% - 3px)) rotate(1.2deg); }
        60% { transform: translate(calc(-50% - 4px), calc(-50% + 3px)) rotate(-0.8deg); }
        80% { transform: translate(calc(-50% + 3px), -50%) rotate(0.6deg); }
      }

      .banner-mega {
        display: inline-block; font-size: 28px; font-weight: 900; letter-spacing: 3px;
        background: linear-gradient(90deg, #ff3d3d, #ffce4a, #6cff9a, #5cb3ff, #d66bff, #ff3d3d);
        background-size: 200% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: mega-sweep 1.6s linear infinite;
      }
      .banner.banner-mega { background: #111; color: #fff;
        animation: mega-glow 900ms ease-in-out infinite alternate;
      }
      .banner.banner-mega .banner-title { font-size: 50px; }
      @keyframes mega-sweep { from { background-position: 0% 0; } to { background-position: 200% 0; } }
      @keyframes mega-glow {
        from { box-shadow: 0 0 40px #ffce4a, inset 0 0 80px #d66bff; }
        to   { box-shadow: 0 0 80px #6cff9a, inset 0 0 140px #5cb3ff; }
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="grp">
        <label>Rules
          <select id="ruleSet">
            <option value="VEGAS">Vegas</option>
            <option value="SPANISH21">Spanish 21</option>
            <option value="PONTOON">Pontoon</option>
            <option value="SUPER_FUN_21">Super Fun 21</option>
          </select>
        </label>
      </div>
      <div class="grp">
        <span id="bankroll">bankroll: 1000</span> &nbsp; <span id="phase">phase: betting</span>
      </div>
    </div>
    <div id="bottom">
      <div class="grp" id="betGroup">
        <label>Bet <input id="betAmount" type="number" value="25" min="5" style="width:70px" /></label>
        <button id="deal">DEAL</button>
      </div>
      <div class="grp" id="actGroup">
        <button data-action="HIT">Hit</button>
        <button data-action="STAND">Stand</button>
        <button data-action="DOUBLE">Double</button>
        <button data-action="SPLIT">Split</button>
        <button data-action="SURRENDER">Surrender</button>
        <button data-action="NEW_ROUND">New Round</button>
      </div>
    </div>
    <div id="log"></div>
    <div id="resultBanner" class="banner"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
